name: H1 Checkout Lock UX Hotfix

on:
  push:
    paths:
      - '.github/workflows/h1-checkout-lock-ux.yml'
      - '.github/h1_checkout_lock_patch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch humanity-live checkout lock UX
        run: python3 .github/h1_checkout_lock_patch.py
      - name: Validate patch
        run: git diff --check
      - name: Commit hotfix
        run: |
          if git diff --quiet -- humanity-live.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "HUMANITY/1 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add humanity-live.html
          git commit -m "Fix checkout payment lock timer UX"
          git push origin HEAD:main
