name: H1 Checkout Lock UX Hotfix

on:
  push:
    paths:
      - '.github/workflows/h1-checkout-lock-ux.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch humanity-live checkout lock UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('humanity-live.html')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {n}')
              s = s.replace(old, new, 1)

          replace_once(
              '<meta name="humanity-build" content="V5.8.5-LEGAL-CONSENT-20260825" />',
              '<meta name="humanity-build" content="V5.8.6-CHECKOUT-LOCK-UX-20260826" />',
              'meta build'
          )

          replace_once(
              '<p>All selected cells are locked together for 7 minutes before payment begins.</p>',
              '<p>You have 7 minutes to begin payment. Once secure provider checkout starts, the selected cells stay locked while that payment is active.</p>',
              'checkout explanatory copy'
          )

          replace_once(
              '.reservation-banner.show{display:flex}\n',
              '.reservation-banner.show{display:flex}\n.reservation-banner.payment-active{background:#edf3ec;border-color:#ceddcb}\n.reservation-banner.payment-active .reservation-clock{background:#31523a}\n',
              'reservation active css'
          )

          old_banner = '''function updateReservationBanner(){
  const banner=document.getElementById('reservationBanner');
  const clock=document.getElementById('reservationClock');
  const status=document.getElementById('reservationStatusText');
  if(!reservationState){
    banner.classList.remove('show');
    return;
  }

  const left=Math.max(0,new Date(reservationState.expiresAt).getTime()-Date.now());
  const seconds=Math.ceil(left/1000);
  const mm=String(Math.floor(seconds/60)).padStart(2,'0');
  const ss=String(seconds%60).padStart(2,'0');

  banner.classList.add('show');
  clock.textContent=`${mm}:${ss}`;
  status.textContent=`${reservationState.itemCount.toLocaleString('en-US')} cells are locked for this checkout.`;

  if(left<=0){
    clearInterval(reservationTimer);
    reservationTimer=null;
    reservationState=null;
    banner.classList.remove('show');
    if(document.getElementById('paymentModal').classList.contains('show')){
      toast('Reservation expired. Tap REVIEW & PAY to reserve the cells again.');
    }
  }
}'''

          new_banner = '''function updateReservationBanner(){
  const banner=document.getElementById('reservationBanner');
  const clock=document.getElementById('reservationClock');
  const status=document.getElementById('reservationStatusText');
  const label=banner?.querySelector('.reservation-copy small');
  if(!reservationState){
    banner?.classList.remove('show','payment-active');
    return;
  }

  const left=Math.max(0,new Date(reservationState.expiresAt).getTime()-Date.now());
  const seconds=Math.ceil(left/1000);
  const mm=String(Math.floor(seconds/60)).padStart(2,'0');
  const ss=String(seconds%60).padStart(2,'0');
  const paymentActive=reservationState.checkoutActive===true;

  banner.classList.add('show');
  banner.classList.toggle('payment-active',paymentActive);
  if(paymentActive){
    if(label)label.textContent='PAYMENT IN PROGRESS';
    clock.textContent='LOCKED';
    status.textContent=`${reservationState.itemCount.toLocaleString('en-US')} cells stay locked while secure payment is active.`;
  }else{
    if(label)label.textContent='CELLS RESERVED';
    clock.textContent=`${mm}:${ss}`;
    status.textContent=`${reservationState.itemCount.toLocaleString('en-US')} cells are temporarily reserved for checkout.`;
  }

  if(left<=0){
    clearInterval(reservationTimer);
    reservationTimer=null;
    reservationState=null;
    banner.classList.remove('show','payment-active');
    if(document.getElementById('paymentModal').classList.contains('show')){
      toast(paymentActive
        ? 'Payment lock expired. Check payment status before starting another checkout.'
        : 'Reservation expired. Tap REVIEW & PAY to reserve the cells again.');
    }
  }
}'''
          replace_once(old_banner, new_banner, 'reservation banner function')

          replace_once(
              '''      amountMinor:Number(result.amount_minor)\n    };''',
              '''      amountMinor:Number(result.amount_minor),\n      checkoutActive:false\n    };''',
              'initial reservation mode'
          )

          replace_once(
              '''    reservationState.expiresAt=result.reservation_expires_at||result.expires_at||reservationState.expiresAt;\n    startReservationTimer();\n\n    saveDodoPending({''',
              '''    reservationState.expiresAt=result.reservation_expires_at||result.expires_at||reservationState.expiresAt;\n    reservationState.checkoutActive=true;\n    startReservationTimer();\n\n    saveDodoPending({''',
              'dodo active mode'
          )

          replace_once(
              '''      paymentRowId:result.payment_row_id||null,\n      createdAt:Date.now()''',
              '''      paymentRowId:result.payment_row_id||null,\n      checkoutActive:true,\n      createdAt:Date.now()''',
              'dodo pending state'
          )

          replace_once(
              '''      batchId:pending.batchId,token:pending.token,expiresAt:pending.expiresAt,\n      itemCount:Number(pending.itemCount||0),amountMinor:Number(pending.amountMinor||0)''',
              '''      batchId:pending.batchId,token:pending.token,expiresAt:pending.expiresAt,\n      itemCount:Number(pending.itemCount||0),amountMinor:Number(pending.amountMinor||0),checkoutActive:true''',
              'dodo fallback resume mode'
          )

          replace_once(
              '''    renderCryptoPayment(result);\n    if(result.reservation_expires_at){\n      reservationState.expiresAt=result.reservation_expires_at;\n      startReservationTimer();\n    }\n    startCryptoPolling();''',
              '''    renderCryptoPayment(result);\n    reservationState.checkoutActive=true;\n    if(result.reservation_expires_at){\n      reservationState.expiresAt=result.reservation_expires_at;\n    }\n    startReservationTimer();\n    startCryptoPolling();''',
              'crypto active mode'
          )

          replace_once(
              "window.HUMANITY_BUILD='V5.8.5-LEGAL-CONSENT-20260825';",
              "window.HUMANITY_BUILD='V5.8.6-CHECKOUT-LOCK-UX-20260826';",
              'runtime build'
          )

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git diff -- humanity-live.html

      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet -- humanity-live.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "HUMANITY/1 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add humanity-live.html
          git commit -m "Fix checkout payment lock timer UX"
          git push origin HEAD:main
