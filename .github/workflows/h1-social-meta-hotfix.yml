name: H1 Social Metadata Hotfix

on:
  push:
    paths:
      - '.github/workflows/h1-social-meta-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch social metadata
        run: python3 .github/h1_social_meta_patch.py
      - name: Verify and commit
        run: |
          git diff --check
          git diff -- humanity-live.html
          if git diff --quiet -- humanity-live.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "HUMANITY/1 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add humanity-live.html
          git commit -m "Add HUMANITY/1 social sharing metadata"
          git push origin HEAD:main
